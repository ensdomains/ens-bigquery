      - name: NameRenewed
        signature: "NameRenewed(string,indexed bytes32,uint256,uint256)"
        parameters:
          - name: name
            type: string
            indexed: false
          - name: label
            type: bytes32
            indexed: true
          - name: cost
            type: uint256
            indexed: false
          - name: expires
            type: uint256
            indexed: false

  - name: EthRegistrarController4
    event_type: registrar_controller
