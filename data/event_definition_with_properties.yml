            indexed: true
          - name: owner
            type: address
            indexed: true
          - name: expires
            type: uint256
            indexed: false
      - name: NameRenewed
        signature: "NameRenewed(indexed uint256,uint256)"
        parameters:
          - name: id
            type: uint256
            indexed: true
          - name: expires
            type: uint256
            indexed: false
      - name: Transfer
        signature: "Transfer(indexed address,indexed address,indexed uint256)"
        parameters:
          - name: from
            type: address
            indexed: true
          - name: to
            type: address
            indexed: true
          - name: tokenId
            type: uint256
            indexed: true

  - name: EthRegistrarController
