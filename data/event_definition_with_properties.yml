          - name: label
            type: bytes32
            indexed: true
          - name: owner
            type: address
            indexed: true
          - name: baseCost
            type: uint256
            indexed: false
          - name: premium
            type: uint256
            indexed: false
          - name: expires
            type: uint256
            indexed: false
      - name: NameRenewed
        signature: "NameRenewed(string,indexed bytes32,uint256,uint256)"
        parameters:
          - name: name
            type: string
            indexed: false
          - name: label
            type: bytes32
            indexed: true
          - name: cost
            type: uint256
            indexed: false
          - name: expires
            type: uint256
            indexed: false

  - name: NameWrapper
    event_type: name_wrapper
    address: 0xD4416b13d2b3a9aBae7AcD5797e58E1AAF138218
    events:
      - name: NameWrapped
        signature: "NameWrapped(indexed bytes32,bytes,indexed address,uint32,uint64)"
        parameters:
          - name: node
            type: bytes32
            indexed: true
          - name: name
            type: bytes
            indexed: false
          - name: owner
            type: address
            indexed: true
          - name: fuses
            type: uint32
            indexed: false
          - name: expiry
            type: uint64
            indexed: false
      - name: NameUnwrapped
        signature: "NameUnwrapped(indexed bytes32,indexed address)"
        parameters:
          - name: node
            type: bytes32
            indexed: true
          - name: owner
